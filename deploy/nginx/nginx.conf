worker_processes auto;
worker_rlimit_nofile 200000;
pid /tmp/nginx.pid;

events {
    worker_connections 65535;
    multi_accept on;
}

http {
    access_log off;
    error_log /dev/stderr warn;

    sendfile on;
    tcp_nodelay on;
    keepalive_timeout 75s;
    keepalive_requests 100000;
    client_max_body_size 256k;      # matches MAX_BODY_BYTES; rejected at the edge
    client_body_buffer_size 256k;

    # Docker's embedded DNS. `resolve` re-reads the A records of `api`, so
    # `docker compose up --scale api=N` is picked up without a reload.
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream api {
        zone api 64k;
        least_conn;
        server api:8000 resolve max_fails=0;
        keepalive 1024;
        keepalive_requests 100000;
        keepalive_timeout 60s;
    }

    server {
        listen 8080 reuseport backlog=8192;

        location = /nginx-health {
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Our deadline is 10s; give the api room to answer with its own 504.
            proxy_connect_timeout 2s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
            # Never replay a non-idempotent POST on another replica.
            proxy_next_upstream error;
            proxy_next_upstream_tries 2;
            proxy_buffering on;
        }
    }
}
