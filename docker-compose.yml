name: zohal-gateway

# Runtime containers must never route service-to-service traffic through an HTTP proxy
# inherited from the host's Docker client config. Image *builds* still get it.
x-no-proxy: &no-proxy
  HTTP_PROXY: ""
  HTTPS_PROXY: ""
  http_proxy: ""
  https_proxy: ""
  NO_PROXY: "*"
  no_proxy: "*"

x-gateway-env: &gateway-env
  <<: *no-proxy
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  REDIS_URL: redis://redis:6379/0
  KAFKA_BOOTSTRAP: kafka:9092
  POSTGRES_DSN: postgresql://gateway:gateway@postgres:5432/gateway
  MONGO_URL: mongodb://mongo:27017
  CELERY_BROKER_URL: amqp://gateway:gateway@rabbitmq:5672//
  OTEL_ENABLED: ${OTEL_ENABLED:-true}
  OTEL_ENDPOINT: http://jaeger:4318
  OTEL_SAMPLE_RATIO: ${OTEL_SAMPLE_RATIO:-0.05}
  # Point at the real starter-kit hosts by overriding these in .env.
  PROVIDER_A_URL: ${PROVIDER_A_URL:-http://mock-a:8000/v1/process}
  PROVIDER_B_URL: ${PROVIDER_B_URL:-http://mock-b:8000/v1/process}
  PROVIDER_C_URL: ${PROVIDER_C_URL:-http://mock-c:8000/v1/process}
  PROVIDER_A_RPS: ${PROVIDER_A_RPS:-200}
  PROVIDER_B_RPS: ${PROVIDER_B_RPS:-1000}
  PROVIDER_C_RPS: ${PROVIDER_C_RPS:-1000}
  MAX_INFLIGHT: ${MAX_INFLIGHT:-4000}
  INBOUND_RATE_RPS: ${INBOUND_RATE_RPS:-20000}
  INBOUND_BURST: ${INBOUND_BURST:-40000}

x-build-args: &build-args
  PIP_MIRROR: ${PIP_MIRROR:-}
  PIP_MIRROR_HOST: ${PIP_MIRROR_HOST:-}

x-gateway-image: &gateway-image
  image: zohal-gateway:latest
  build:
    context: .
    args: *build-args
  restart: unless-stopped
  ulimits:
    nofile: { soft: 65536, hard: 65536 }

x-mock: &mock
  image: zohal-mock-provider:latest
  build:
    context: ./mocks
    args: *build-args
  restart: unless-stopped
  ulimits:
    nofile: { soft: 65536, hard: 65536 }
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
    interval: 5s
    timeout: 3s
    retries: 10

services:
  # ------------------------------------------------------------------ edge + api
  nginx:
    image: nginx:1.27-alpine
    environment: *no-proxy
    ports:
      - "${GATEWAY_PORT:-8088}:8080"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ulimits:
      nofile: { soft: 200000, hard: 200000 }
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  api:
    <<: *gateway-image
    environment: *gateway-env
    deploy:
      replicas: ${API_REPLICAS:-4}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 5s
    depends_on:
      redis: { condition: service_healthy }
      mock-a: { condition: service_healthy }
      mock-b: { condition: service_healthy }
      mock-c: { condition: service_healthy }
    stop_grace_period: 15s

  # ------------------------------------------------------------------ audit path
  audit-consumer:
    <<: *gateway-image
    command: ["python", "-m", "gateway.audit.consumer"]
    environment: *gateway-env
    deploy:
      replicas: ${CONSUMER_REPLICAS:-2}
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }

  celery-worker:
    <<: *gateway-image
    command: ["celery", "-A", "gateway.jobs.celery_app", "worker", "--loglevel", "INFO", "--concurrency", "2"]
    environment: *gateway-env
    depends_on:
      rabbitmq: { condition: service_healthy }
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  celery-beat:
    <<: *gateway-image
    command: ["celery", "-A", "gateway.jobs.celery_app", "beat", "--loglevel", "INFO", "--schedule", "/tmp/celerybeat-schedule"]
    environment: *gateway-env
    depends_on:
      rabbitmq: { condition: service_healthy }

  # ------------------------------------------------------------------ data stores
  redis:
    image: redis:7-alpine
    # Coordination state only (limits, breakers, idempotency); everything has a TTL.
    command: ["redis-server", "--save", "", "--appendonly", "no",
              "--maxmemory", "1gb", "--maxmemory-policy", "volatile-ttl",
              "--tcp-backlog", "4096", "--maxclients", "20000"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.8.0
    environment:
      <<: *no-proxy
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_HEAP_OPTS: "-Xms768m -Xmx768m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:3.8.0
    environment: *no-proxy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        T=/opt/kafka/bin/kafka-topics.sh
        $$T --bootstrap-server kafka:9092 --create --if-not-exists --topic audit.requests \
            --partitions 12 --replication-factor 1 --config retention.ms=86400000
        $$T --bootstrap-server kafka:9092 --create --if-not-exists --topic audit.requests.dlq \
            --partitions 3 --replication-factor 1 --config retention.ms=604800000
        $$T --bootstrap-server kafka:9092 --describe --topic audit.requests
    depends_on:
      kafka: { condition: service_healthy }
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "max_wal_size=4GB",
              "-c", "checkpoint_timeout=15min", "-c", "wal_compression=on",
              "-c", "max_connections=200"]
    volumes:
      - ./deploy/postgres:/docker-entrypoint-initdb.d:ro
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 3s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  mongo:
    image: mongo:6.0
    command: ["mongod", "--wiredTigerCacheSizeGB", "1"]
    volumes:
      - ./deploy/mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: gateway
      RABBITMQ_DEFAULT_PASS: gateway
      # Erlang schedulers busy-wait by default and burn idle cores in containers.
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+sbwt none +sbwtdcpu none +sbwtdio none"
    ports:
      - "${RABBITMQ_UI_PORT:-15673}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  # ------------------------------------------------------------------ mock providers
  # Documented profiles. MOCK_* overrides switch to overhead-isolation mode (bench/overhead.env).
  mock-a:
    <<: *mock
    environment:
      PROVIDER_NAME: A
      LATENCY_MIN_MS: ${MOCK_A_LATENCY_MIN_MS:-300}
      LATENCY_MAX_MS: ${MOCK_A_LATENCY_MAX_MS:-1000}
      ERROR_RATE: ${MOCK_A_ERROR_RATE:-0.001}
      TIMEOUT_RATE: "0"
      RATE_LIMIT_RPS: ${MOCK_A_RATE_LIMIT_RPS:-100}
      RATE_LIMIT_BURST: ${MOCK_A_RATE_LIMIT_BURST:-20}

  mock-b:
    <<: *mock
    environment:
      PROVIDER_NAME: B
      LATENCY_MIN_MS: ${MOCK_BC_LATENCY_MIN_MS:-1000}
      LATENCY_MAX_MS: ${MOCK_BC_LATENCY_MAX_MS:-10000}
      ERROR_RATE: ${MOCK_BC_ERROR_RATE:-0.05}
      TIMEOUT_RATE: ${MOCK_BC_TIMEOUT_RATE:-0.02}
      RATE_LIMIT_RPS: ${MOCK_BC_RATE_LIMIT_RPS:-1000}
      RATE_LIMIT_BURST: ${MOCK_BC_RATE_LIMIT_BURST:-200}

  mock-c:
    <<: *mock
    environment:
      PROVIDER_NAME: C
      LATENCY_MIN_MS: ${MOCK_BC_LATENCY_MIN_MS:-1000}
      LATENCY_MAX_MS: ${MOCK_BC_LATENCY_MAX_MS:-10000}
      ERROR_RATE: ${MOCK_BC_ERROR_RATE:-0.05}
      TIMEOUT_RATE: ${MOCK_BC_TIMEOUT_RATE:-0.02}
      RATE_LIMIT_RPS: ${MOCK_BC_RATE_LIMIT_RPS:-1000}
      RATE_LIMIT_BURST: ${MOCK_BC_RATE_LIMIT_BURST:-200}

  # ------------------------------------------------------------------ observability
  prometheus:
    image: prom/prometheus:v2.54.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d",
              "--web.enable-lifecycle"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9095}:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      <<: *no-proxy
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/gateway.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3300}:3000"
    depends_on: [prometheus]
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      <<: *no-proxy
      COLLECTOR_OTLP_ENABLED: "true"
      MEMORY_MAX_TRACES: "20000"      # in-memory store: bound it
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
    restart: unless-stopped

  # ------------------------------------------------------------------ load generator
  k6:
    image: grafana/k6:0.53.0
    profiles: ["bench"]
    environment:
      <<: *no-proxy
      TARGET: http://nginx:8080
    volumes:
      - ./bench/k6:/scripts:ro
      - ./bench/results:/results
    entrypoint: ["k6"]
    command: ["run", "/scripts/realistic.js"]
    # No depends_on on purpose: `compose run k6` must never recreate or rescale the
    # stack under test (it would re-resolve the api replica count and mock profile).

volumes:
  kafka-data:
  pg-data:
  mongo-data:
